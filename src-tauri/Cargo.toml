[package]
name = "easy-keys"
version = "0.3.0"
description = "Fully-local AI API Key manager: encrypted vault, speed test, env var injection"
authors = ["easy-keys"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "easy_keys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
zeroize = { version = "1", features = ["zeroize_derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
base64 = "0.22"
thiserror = "2"
futures-util = "0.3"

# E2E 专用：内嵌 WebDriver server，仅 e2e feature 下编译，release 构建严禁包含
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver"]
