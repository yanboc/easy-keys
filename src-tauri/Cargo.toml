[package]
name = "easy-keys"
version = "0.4.0"
description = "Fully-local AI API Key manager: encrypted vault, speed test, env var injection"
authors = ["easy-keys"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "easy_keys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
zeroize = { version = "1", features = ["zeroize_derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
base64 = "0.22"
thiserror = "2"
futures-util = "0.3"
trash = "5"

# E2E 专用：内嵌 WebDriver server，仅 e2e feature 下编译，release 构建严禁包含
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

# 生物识别解锁：macOS 走 Keychain 访问控制项（SecAccessControl + userPresence）
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFDictionary", "CFError", "CFNumber", "CFString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext"] }
objc2-security = { version = "0.3", default-features = false, features = ["std", "SecBase", "SecAccessControl", "SecItem"] }

# 生物识别解锁：Windows 走 Credential Locker + UserConsentVerifier（Windows Hello）
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.56", features = ["Foundation", "Security_Credentials", "Security_Credentials_UI", "Win32_System_WinRT"] }

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver"]
